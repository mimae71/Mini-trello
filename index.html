<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Mini trello</title>
  </head>
  <body>
    <div class="app-trello__container">
      <div class="app-trello__column" data-column="todo">
        <h2 class="app-trello__column-title">A faire</h2>
        <ul class="app-trello__task-list">
          <li>1ere tache</li>
          <li>2eme tache</li>
          <li>3eme tache</li>
        </ul>
        <form class="app-trello__task-form">
          <input
            type="text"
            class="app-trello__task-form-input"
            placeholder="Nouvelle tâche..."
            required
          />
          <button class="app-trello__task-form-btn">Ajouter</button>
        </form>
      </div>
      <div class="app-trello__column" data-column="doing">
        <h2 class="app-trello__column-title">En cours</h2>
        <ul class="app-trello__task-list">
          <li>1ere tache</li>
          <li>2eme tache</li>
          <li>3eme tache</li>
        </ul>
        <form class="app-trello__task-form">
          <input
            type="text"
            class="app-trello__task-form-input"
            placeholder="Nouvelle tâche..."
            required
          />
          <button class="app-trello__task-form-btn">Ajouter</button>
        </form>
      </div>
      <div class="app-trello__column" data-column="done">
        <h2 class="app-trello__column-title">Terminé</h2>
        <ul class="app-trello__task-list">
          <li>1ere tache</li>
          <li>2eme tache</li>
          <li>3eme tache</li>
        </ul>
        <form class="app-trello__task-form">
          <input
            type="text"
            class="app-trello__task-form-input"
            placeholder="Nouvelle tâche..."
            required
          />
          <button class="app-trello__task-form-btn">Ajouter</button>
        </form>
      </div>
    </div>
    <script src="./main.js"></script>
  </body>
</html>
